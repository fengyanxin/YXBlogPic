<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" style="max-width:100%;height:auto;">
  <rect width="720" height="380" fill="#f8f9fa" rx="12"/>
  <text x="360" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">AI Workflow 核心架构组成</text>

  <ellipse cx="360" cy="195" rx="68" ry="48" fill="#1a1a2e"/>
  <text x="360" y="188" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">AI</text>
  <text x="360" y="204" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Workflow</text>
  <text x="360" y="218" text-anchor="middle" font-size="10" fill="#aaa">编排引擎</text>

  <line x1="295" y1="165" x2="175" y2="98" stroke="#e74c3c" stroke-width="2"/>
  <rect x="60"  y="52"  width="115" height="78" rx="9" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="117" y="76"  text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">LLM/模型</text>
  <text x="72"  y="93"  font-size="9" fill="#777">GPT-4、Claude</text>
  <text x="72"  y="105" font-size="9" fill="#777">Gemini、本地模型</text>
  <text x="72"  y="117" font-size="9" fill="#777">Workflow 的大脑</text>

  <line x1="340" y1="148" x2="305" y2="60" stroke="#f39c12" stroke-width="2"/>
  <rect x="232" y="18"  width="115" height="78" rx="9" fill="#fef5e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="289" y="42"  text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">工具/Tools</text>
  <text x="244" y="59"  font-size="9" fill="#777">搜索、代码执行</text>
  <text x="244" y="71"  font-size="9" fill="#777">数据库、外部 API</text>
  <text x="244" y="83"  font-size="9" fill="#777">与外部交互</text>

  <line x1="419" y1="150" x2="455" y2="62" stroke="#2ecc71" stroke-width="2"/>
  <rect x="390" y="18"  width="115" height="78" rx="9" fill="#eafaf1" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="447" y="42"  text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">记忆/Memory</text>
  <text x="400" y="59"  font-size="9" fill="#777">短期：对话历史</text>
  <text x="400" y="71"  font-size="9" fill="#777">长期：向量数据库</text>
  <text x="400" y="83"  font-size="9" fill="#777">跨会话持久化</text>

  <line x1="425" y1="195" x2="545" y2="160" stroke="#3498db" stroke-width="2"/>
  <rect x="547" y="112" width="115" height="78" rx="9" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/>
  <text x="604" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">状态/State</text>
  <text x="557" y="153" font-size="9" fill="#777">任务进度、中间</text>
  <text x="557" y="165" font-size="9" fill="#777">结果、上下文传递</text>
  <text x="557" y="177" font-size="9" fill="#777">如同接力棒</text>

  <line x1="415" y1="235" x2="530" y2="270" stroke="#9b59b6" stroke-width="2"/>
  <rect x="530" y="250" width="130" height="78" rx="9" fill="#f5eafb" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="595" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e44ad">人工介入</text>
  <text x="540" y="291" font-size="9" fill="#777">审核、反馈</text>
  <text x="540" y="303" font-size="9" fill="#777">纠正、授权</text>
  <text x="540" y="315" font-size="9" fill="#777">高风险操作暂停</text>

  <line x1="305" y1="228" x2="195" y2="272" stroke="#e67e22" stroke-width="2"/>
  <rect x="60"  y="252" width="130" height="78" rx="9" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="125" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">路由/条件</text>
  <text x="70"  y="293" font-size="9" fill="#777">根据条件决定</text>
  <text x="70"  y="305" font-size="9" fill="#777">走哪条执行路径</text>
  <text x="70"  y="317" font-size="9" fill="#777">分支、循环、跳转</text>

  <line x1="293" y1="193" x2="175" y2="200" stroke="#2c3e50" stroke-width="2"/>
  <rect x="60"  y="162" width="115" height="62" rx="9" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="117" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">输入/输出</text>
  <text x="70"  y="200" font-size="9" fill="#777">文本、图像、文件</text>
  <text x="70"  y="213" font-size="9" fill="#777">结构化数据</text>

  <text x="360" y="360" text-anchor="middle" font-size="10" fill="#888">各组件由编排引擎（LangChain / LlamaIndex / Dify 等）统一调度协作</text>
</svg>
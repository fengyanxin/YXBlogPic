<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" style="max-width:100%;height:auto;">
  <rect width="680" height="220" fill="#f8f9fa" rx="12"/>
  <text x="340" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a2e">模式二：条件路由（Conditional Routing）</text>

  <rect x="18" y="80" width="110" height="55" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="73" y="100" text-anchor="middle" font-size="11" fill="#2c3e50" font-weight="bold">用户问题</text>
  <text x="73" y="115" text-anchor="middle" font-size="9" fill="#777">"怎么用 Python</text>
  <text x="73" y="127" text-anchor="middle" font-size="9" fill="#777">排序列表？"</text>

  <polygon points="130,107 145,100 145,114" fill="#bbb"/>

  <polygon points="230,80 295,107 230,135 165,107" fill="#f39c12" opacity="0.9"/>
  <text x="230" y="100" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">意图分类</text>
  <text x="230" y="114" text-anchor="middle" font-size="9"  fill="#fff">Router</text>

  <line x1="295" y1="95" x2="350" y2="55" stroke="#3498db" stroke-width="1.5"/>
  <rect x="352" y="32" width="115" height="50" rx="8" fill="#eaf4fb" stroke="#3498db" stroke-width="1.5"/>
  <text x="409" y="52" text-anchor="middle" font-size="10" font-weight="bold" fill="#2980b9">代码问题</text>
  <text x="409" y="68" text-anchor="middle" font-size="9" fill="#555">→ 代码生成 Agent</text>
  <polygon points="469,57 484,50 484,64" fill="#3498db"/>
  <rect x="486" y="32" width="160" height="50" rx="8" fill="#eaf4fb" stroke="#3498db" stroke-width="1"/>
  <text x="566" y="52" text-anchor="middle" font-size="9" fill="#2980b9">运行代码验证</text>
  <text x="566" y="66" text-anchor="middle" font-size="9" fill="#2980b9">返回结果+解释</text>

  <line x1="295" y1="107" x2="350" y2="107" stroke="#2ecc71" stroke-width="1.5"/>
  <rect x="352" y="83" width="115" height="50" rx="8" fill="#eafaf1" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="409" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">知识问题</text>
  <text x="409" y="118" text-anchor="middle" font-size="9" fill="#555">→ RAG 知识库检索</text>
  <polygon points="469,107 484,100 484,114" fill="#2ecc71"/>
  <rect x="486" y="83" width="160" height="50" rx="8" fill="#eafaf1" stroke="#2ecc71" stroke-width="1"/>
  <text x="566" y="103" text-anchor="middle" font-size="9" fill="#27ae60">召回相关文档</text>
  <text x="566" y="117" text-anchor="middle" font-size="9" fill="#27ae60">基于文档生成答案</text>

  <line x1="295" y1="120" x2="350" y2="160" stroke="#e74c3c" stroke-width="1.5"/>
  <rect x="352" y="136" width="115" height="50" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="409" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">实时问题</text>
  <text x="409" y="170" text-anchor="middle" font-size="9" fill="#555">→ 联网搜索</text>
  <polygon points="469,161 484,154 484,168" fill="#e74c3c"/>
  <rect x="486" y="136" width="160" height="50" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="1"/>
  <text x="566" y="156" text-anchor="middle" font-size="9" fill="#c0392b">搜索最新信息</text>
  <text x="566" y="170" text-anchor="middle" font-size="9" fill="#c0392b">整合成答案</text>

  <text x="340" y="205" text-anchor="middle" font-size="10" fill="#888">路由节点根据问题类型，将任务派发给最合适的处理分支</text>
</svg>